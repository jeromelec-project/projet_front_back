<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
    <title>Signin</title>
</head>
<body>
<div class="wrapper">
    <header>
        <img src="logo_jobnest.png" alt="Logo" class="logo">
        <h1>JobNest</h1>
        <div class="connectionButton">
            <div class="menuBurger"><i class="fi fi-rr-menu-burger"></i></div>
        </div>
    </header>

    <div class="content">

        <div class="signin">

            <h2>Créer votre compte</h2>

            <form action="" method="post" class="signinForm">
                <div class="labelEtInput">
                <label for="username">Nom d'utilisateur :</label>
                <input type="text" id="username" name="username" required>
                </div>

                <div class="labelEtInput">
                <label for="email">Email :</label>
                <input type="email" id="email" name="email" required>
                </div>

                <div class="labelEtInput">
                <label for="password">Mot de passe : *</label>
                <input type="password" id="password" name="password" required>
                </div>

                <div class="conditionsAndButton">
                    <p>
                        (*) Le mot de passe doit contenir au moins 8 caractères et un caractère spécial.
                    </p>
                    <div class="containerErrorAndButton">
                        <div class="errorSignin">Ce compte existe déjà.</div>
                        <button type="submit">Créer un compte</button>
                    </div>
                </div>



            </form>   


        </div>

    </div>


    <footer>
        <p class="copyright"><span>Copyright 2026 &copy; JobNest |</span> <span>Tous droits réservés</span></p>
        <p class="mentions"><span>Mentions Légales |</span> <span>Politique de confidentialité</span></p>
        <img src="logo_jobnest.png" alt="Logo" class="logo_footer">
    </footer>
</div><!-- fin de wrapper -->
</body>
</html>
